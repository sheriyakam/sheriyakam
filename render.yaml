services:
  - type: web
    name: sheriyakam-api
    env: node
    plan: free
    region: singapore # Closest low-latency region to Kerala / India
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
