name: Sheriyakam CI / Build Verification

on:
  push:
    branches:
      - master
      - feature/kmp-native-migration
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web-and-node:
    name: Web, Node & Security Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: 🔍 TypeScript Type Check
        run: npx tsc --noEmit

      - name: 🧹 ESLint Quality Check
        run: npm run lint

      - name: 🧪 Run Automated Unit & Integration Tests
        run: npm test

      - name: 🚀 Expo Web Static Export (148 pages)
        run: npx expo export -p web
        env:
          NODE_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'placeholder_anon_key' }}

  verify-android-and-kmp:
    name: Kotlin Multiplatform & Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🧪 Run KMP Common Unit Tests
        run: ./gradlew :shared:testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: 📱 Assemble Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon
        continue-on-error: true

  verify-ios-native:
    name: iOS Swift & SwiftUI Build Gate
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17 for KMP XCFramework
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🍎 Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: 🛠️ Build Shared KMP Framework for iOS Simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon
        continue-on-error: true
